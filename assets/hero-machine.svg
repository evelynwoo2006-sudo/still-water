<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="一只坐在桌边的小猫线稿，身后有一轮小月亮和一个毛线球">
  <title>A small cat</title>
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#f6f2e8"/>
      <stop offset="1" stop-color="#e6e8e1"/>
    </linearGradient>
    <radialGradient id="mglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>
    <filter id="mgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#mbg)"/>
  <circle cx="908" cy="188" r="160" fill="url(#mglow)"/>
  <circle cx="908" cy="188" r="46" fill="#fcf7ea"/>
  <circle cx="908" cy="188" r="46" fill="none" stroke="#8aa2a4" stroke-opacity="0.35"/>

  <!-- 星 -->
  <g fill="#4f6b78" opacity="0.4">
    <circle cx="230" cy="146" r="2"/>
    <circle cx="352" cy="108" r="1.4"/>
    <circle cx="470" cy="176" r="1.8"/>
    <circle cx="640" cy="116" r="1.2"/>
    <circle cx="1046" cy="132" r="2"/>
    <circle cx="1092" cy="268" r="1.4"/>
    <circle cx="176" cy="248" r="1.2"/>
  </g>

  <!-- 桌面 -->
  <line x1="90" y1="540" x2="1110" y2="540" stroke="#1c2630" stroke-opacity="0.3"/>
  <line x1="90" y1="560" x2="1110" y2="560" stroke="#1c2630" stroke-opacity="0.1"/>

  <!-- 影子 -->
  <ellipse cx="600" cy="540" rx="132" ry="7" fill="#1c2630" opacity="0.07"/>

  <!-- 毛线球：另一件没有用的东西 -->
  <g stroke="#4f6b78" stroke-opacity="0.55" fill="none" stroke-width="1.4">
    <circle cx="446" cy="512" r="24"/>
    <path d="M 428 494 C 448 506 448 524 436 534"/>
    <path d="M 466 496 C 448 508 448 528 458 534"/>
    <path d="M 446 488 C 442 500 452 506 462 500"/>
  </g>
  <path d="M 466 524 C 486 528 492 540 486 546" stroke="#4f6b78" stroke-opacity="0.45" fill="none" stroke-width="1.2"/>

  <!-- 尾巴 -->
  <path d="M 688 508 C 758 532 800 466 762 422 C 748 406 732 408 726 422"
        fill="none" stroke="#1c2630" stroke-opacity="0.42" stroke-width="3" stroke-linecap="round"/>

  <!-- 身体 -->
  <path d="M 512 540 C 500 470 512 408 552 384 L 648 384 C 688 408 700 470 688 540 Z"
        fill="#fbf7ee" stroke="#1c2630" stroke-opacity="0.42" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 600 424 C 594 456 592 498 596 538"
        fill="none" stroke="#1c2630" stroke-opacity="0.16" stroke-width="1.4"/>
  <path d="M 540 538 C 540 520 552 514 563 520"
        fill="none" stroke="#1c2630" stroke-opacity="0.22" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 660 538 C 660 520 648 514 637 520"
        fill="none" stroke="#1c2630" stroke-opacity="0.22" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 耳朵 -->
  <path d="M 536 276 L 520 196 L 596 246 Z" fill="#fbf7ee" stroke="#1c2630" stroke-opacity="0.42" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 664 276 L 680 196 L 604 246 Z" fill="#fbf7ee" stroke="#1c2630" stroke-opacity="0.42" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 542 262 L 532 214 L 578 246 Z" fill="#a8775f" opacity="0.22"/>
  <path d="M 658 262 L 668 214 L 622 246 Z" fill="#a8775f" opacity="0.22"/>

  <!-- 头 -->
  <circle cx="600" cy="332" r="86" fill="#fbf7ee" stroke="#1c2630" stroke-opacity="0.42" stroke-width="2.2"/>
  <ellipse cx="566" cy="330" rx="8" ry="10" fill="#26313a" opacity="0.82"/>
  <ellipse cx="634" cy="330" rx="8" ry="10" fill="#26313a" opacity="0.82"/>
  <path d="M 590 352 L 610 352 L 600 366 Z" fill="#a8775f" opacity="0.75"/>
  <path d="M 600 366 L 600 376" stroke="#1c2630" stroke-opacity="0.32" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 600 376 q -11 9 -20 2" fill="none" stroke="#1c2630" stroke-opacity="0.32" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 600 376 q 11 9 20 2" fill="none" stroke="#1c2630" stroke-opacity="0.32" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 胡须 -->
  <g stroke="#1c2630" stroke-opacity="0.2" stroke-width="1.3" stroke-linecap="round">
    <line x1="556" y1="358" x2="470" y2="344"/>
    <line x1="556" y1="368" x2="462" y2="366"/>
    <line x1="556" y1="378" x2="472" y2="390"/>
    <line x1="644" y1="358" x2="730" y2="344"/>
    <line x1="644" y1="368" x2="738" y2="366"/>
    <line x1="644" y1="378" x2="728" y2="390"/>
  </g>

  <!-- 呼噜声 -->
  <g stroke="#a8775f" stroke-opacity="0.35" fill="none" stroke-width="1.4" stroke-linecap="round">
    <path d="M 492 262 q -18 16 0 32"/>
    <path d="M 470 250 q -28 26 0 56"/>
  </g>

  <!-- 标注 -->
  <line x1="120" y1="626" x2="1080" y2="626" stroke="#1c2630" stroke-opacity="0.14"/>
  <text x="120" y="666" font-family="Georgia, serif" font-size="19" letter-spacing="5" fill="#78868d" opacity="0.9">USELESS &#183; CAT</text>
  <text x="1080" y="666" text-anchor="end" font-family="Georgia, serif" font-size="19" letter-spacing="5" fill="#78868d" opacity="0.9">NO. 01</text>

  <rect width="1200" height="700" filter="url(#mgrain)" opacity="0.05" style="mix-blend-mode:multiply"/>
</svg>
