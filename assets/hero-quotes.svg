<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="像被读过的书页一样的横线，其中一行被标成暖色">
  <title>页边</title>
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#eae4d6"/>
    </linearGradient>
    <radialGradient id="qglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbf1" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fffbf1" stop-opacity="0"/>
    </radialGradient>
    <filter id="qgrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#qbg)"/>
  <circle cx="1024" cy="112" r="190" fill="url(#qglow)"/>
  <path d="M1024 66 a46 46 0 1 0 33 77 a38 38 0 1 1 -33 -77 z" fill="#f8f1e0"/>
  <circle cx="1024" cy="112" r="52" fill="none" stroke="#8aa2a4" stroke-opacity="0.3"/>

  <!-- 装订线 -->
  <line x1="104" y1="96" x2="104" y2="612" stroke="#a8775f" stroke-opacity="0.28"/>

  <!-- 文字般的横线 -->
  <g fill="#1c2630">
    <rect x="146" y="128" width="486" height="3" opacity="0.3" rx="1.5"/>
    <rect x="146" y="170" width="682" height="3" opacity="0.26" rx="1.5"/>
    <rect x="146" y="212" width="404" height="3" opacity="0.24" rx="1.5"/>
    <rect x="146" y="254" width="700" height="3" opacity="0.22" rx="1.5"/>
    <rect x="146" y="296" width="320" height="3" opacity="0.2" rx="1.5"/>
  </g>

  <!-- 被标出的一句 -->
  <rect x="126" y="332" width="836" height="92" fill="#a8775f" opacity="0.13"/>
  <g fill="#a8775f">
    <rect x="146" y="356" width="776" height="4" opacity="0.8" rx="2"/>
    <rect x="146" y="394" width="556" height="4" opacity="0.55" rx="2"/>
  </g>

  <g fill="#1c2630">
    <rect x="146" y="462" width="640" height="3" opacity="0.24" rx="1.5"/>
    <rect x="146" y="504" width="508" height="3" opacity="0.21" rx="1.5"/>
    <rect x="146" y="546" width="700" height="3" opacity="0.18" rx="1.5"/>
    <rect x="146" y="588" width="366" height="3" opacity="0.15" rx="1.5"/>
  </g>

  <!-- 页码 -->
  <line x1="146" y1="628" x2="1054" y2="628" stroke="#1c2630" stroke-opacity="0.14"/>
  <text x="146" y="674" font-family="Georgia, serif" font-size="22" letter-spacing="8" fill="#78868d" opacity="0.95">18</text>
  <text x="1054" y="674" text-anchor="end" font-family="Georgia, serif" font-size="20" letter-spacing="6" fill="#78868d" opacity="0.95">QUOTES</text>

  <rect width="1200" height="700" filter="url(#qgrain)" opacity="0.055" style="mix-blend-mode:multiply"/>
</svg>
